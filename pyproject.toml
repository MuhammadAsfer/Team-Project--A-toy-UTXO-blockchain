[project]
name = "team-02-toy-utxo-blockchain"
version = "0.1.0"
description = "Project 07: A toy UTXO blockchain with ECDSA signatures, UTXO undo state, and PoW reorgs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utxochain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "regtest: tests requiring a local bitcoind regtest node",
]
